name: validate-nodes
# 강제성 ① CI 게이트 — 어떤 AI/사람이 만든 변경이든 원격에서 규칙을 재검증.
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: deps
        run: pip install pyyaml jsonschema
      - name: 노드 적합성 검증
        run: python tools/validate_node.py --strict
      - name: 진입 규칙 파일 최신화 확인
        run: |
          python tools/gen_agent_rules.py
          git diff --exit-code -- CLAUDE.md AGENTS.md GEMINI.md .cursorrules .github/copilot-instructions.md \
            || { echo "::error::진입 규칙 파일이 오래됨 — 'python tools/gen_agent_rules.py' 후 커밋하세요."; exit 1; }
