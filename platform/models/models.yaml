# 모델/API 키 추상화 (LiteLLM 기반). 논리적 역할 → 프로바이더/모델/ENV 참조.
# 실행층: tools/lib/llm.py (점검: `harness models`). 키는 절대 평문 금지 — *_env 로 환경변수 참조만.
# model 은 LiteLLM 유효 id. 키가 없으면 해당 역할은 '비활성'(임의 폴백 없음).
# 의존성은 키/모델 명시 시에만 부착(설계 원칙).  (ARCHITECTURE §5, §9)
roles:
  # 핵심 플랫폼은 특정 벤더를 전제하지 않는다. provider/model/api_key_env 를 채울 때만 그 역할이
  # 활성(미설정이면 비활성 — 임의 폴백 없음). 예시는 위 주석 참고.
  planner:   { provider: null, model: null, api_key_env: null }
  coder:     { provider: null, model: null, api_key_env: null }
  verifier:  { provider: null, model: null, api_key_env: null }
  classifier: { provider: null, model: null, api_key_env: null }  # data→info 라우팅 분류(없으면 coder→크기폴백)
  embedder:
    provider: local         # 로컬 임베딩(벤더 무관). 기본 Qwen3-Embedding-0.6B. API로 교체 시 api_key_env 추가
    model: Qwen/Qwen3-Embedding-0.6B   # 대안: BAAI/bge-m3 (MIT, hybrid). 둘 다 1024차원
# 다른 프로바이더로 교체 예 (role 블록을 아래처럼):
#   coder: { provider: openai, model: gpt-4o,            api_key_env: OPENAI_API_KEY }
#   coder: { provider: gemini, model: gemini-1.5-pro,    api_key_env: GEMINI_API_KEY }
#   coder: { provider: ollama, model: ollama/llama3 }   # 로컬 LLM, 키 불필요

# 임베딩 백엔드 (로컬 기본). router/MCP 서버가 참조.
#   HARNESS_EMBED_BACKEND=local|hash  (env 로 오버라이드)
#   HARNESS_EMBED_MODEL=Qwen/Qwen3-Embedding-0.6B  (대안: BAAI/bge-m3)
embedding:
  backend: local          # local(Qwen3-Embedding-0.6B 기본) | hash(오프라인 폴백/테스트)
  model: Qwen/Qwen3-Embedding-0.6B   # 다국어·한국어 우수, 1024차원. 대안 BAAI/bge-m3
  dim: 1024
  store: sqlite-vec        # info/vector/store.db
