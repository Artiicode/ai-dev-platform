# 외부 MCP 서버 레지스트리 (옵트인). harnesses.yaml 과 같은 철학.
# `harness mcp <harness> [--node NAME]` 가 substrate(노드별) 서버 + 아래 enabled 외부 서버를
# 그 하네스의 MCP 설정 파일(.mcp.json / .cursor/mcp.json …)로 병합한다. 생성물은 모두 .gitignore.
#
# 시크릿 정책: 토큰/키 평문 금지. 여기 env 값은 ${ENV_VAR} 참조로만 둔다(키 이름 선언용).
#   실제 값은 루트 `.env`(gitignored)에 넣는다 — 예: JIRA_API_TOKEN=xxxx
#   `harness mcp` 가 외부 서버를 tools/mcp_launch.py 로 감싸 기동하므로, 서버는 .env 를 자동
#   주입받는다(셸 export 불필요·재부팅에도 유지·단일 소스). 값에 #/공백이 있으면 .env 에서 따옴표.
#
# 아래 servers 는 예시 골격이다 — 실제 패키지명/인자는 각 MCP 서버 문서에 맞게 조정하라.
servers:
  jira:
    command: npx
    args: ["-y", "mcp-jira"]
    env:
      JIRA_URL: ${JIRA_URL}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN}
  figma:
    command: npx
    args: ["-y", "figma-developer-mcp", "--stdio"]
    env:
      FIGMA_API_KEY: ${FIGMA_API_KEY}
  bitbucket:
    command: npx
    args: ["-y", "mcp-bitbucket"]
    env:
      BITBUCKET_USERNAME: ${BITBUCKET_USERNAME}
      BITBUCKET_APP_PASSWORD: ${BITBUCKET_APP_PASSWORD}

# 사용할 외부 MCP 만 켠다(비우면 substrate 만). 예: enabled: ["jira", "figma"]
enabled: []
