# 프로젝트 노드 manifest. /init-project 가 <project>-node/manifest.yaml 로 복제.
# 스키마: docs/schemas/node-manifest.schema.json
node:
  name: project_A           # 예: project_A
  schema_version: 1
  harness_min_version: 0.1.0
link:
  type: path            # path | git-submodule | git-clone
  url: git@github.com:org/project_A.git
  ref: main
  path: repo
bootstrap:
  package_managers: [pip]
  setup: []                  # 예: ["pip install -e .", "npm ci"]
storage:
  md_max_chars: 8000
  vector_min_chars: 8000
