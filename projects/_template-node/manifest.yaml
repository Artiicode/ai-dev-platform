# 프로젝트 노드 manifest. /init-project 가 <project>-node/manifest.yaml 로 복제.
# 스키마: docs/schemas/node-manifest.schema.json
node:
  name: REPLACE_ME           # 예: my_proj
  schema_version: 1
  harness_min_version: 0.1.0
  # shares: [_shared]        # (선택) 읽기전용 공유 지식 노드. 검색/읽기가 own+shared 로 페더레이션
link:
  type: git-clone            # path | git-submodule | git-clone | symlink
  url: git@github.com:org/REPLACE_ME.git
  ref: main
  path: repo
  # symlink 시: target: /abs/path/to/existing/project  (대상 디렉토리가 존재해야 함)
bootstrap:
  package_managers: [pip]
  setup: []                  # 예: ["pip install -e .", "npm ci"]
storage:
  md_max_chars: 8000
  vector_min_chars: 8000
